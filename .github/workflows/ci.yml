name: CI

on:
  push:
    branches: [main, test]
  pull_request:
    branches: [main, test]

jobs:
  # ─────────────────────────────────────────────
  #  Backend — Go
  # ─────────────────────────────────────────────
  backend:
    name: Backend (Go)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend_school_crm

    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: backend_school_crm/go.mod
          cache-dependency-path: backend_school_crm/go.sum

      - name: Download modules
        run: go mod download

      - name: Verify go.sum
        run: go mod verify

      - name: go vet
        run: go vet ./...

      - name: Build
        run: go build ./cmd/...

      - name: Test
        run: go test ./... -race -short -coverprofile=coverage.out

      - name: Coverage summary
        run: go tool cover -func=coverage.out | tail -1

  # ─────────────────────────────────────────────
  #  Backend — Integration tests (with Docker)
  # ─────────────────────────────────────────────
  backend-integration:
    name: Backend Integration (Go + Docker)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend_school_crm

    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: backend_school_crm/go.mod
          cache-dependency-path: backend_school_crm/go.sum

      - name: Download modules
        run: go mod download

      - name: Integration tests
        run: go test -race -timeout 300s -coverprofile=coverage-integration.out ./...

      - name: Coverage summary (integration)
        run: go tool cover -func=coverage-integration.out | tail -1

  # ─────────────────────────────────────────────
  #  Frontend — Next.js
  # ─────────────────────────────────────────────
  frontend:
    name: Frontend (Next.js)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend_school_crm

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend_school_crm/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Type check
        run: npx tsc --noEmit

      - name: Build
        run: npm run build
        env:
          # Provide a placeholder so config.ts doesn't mark the build as fatal.
          # The real URL is set in Railway at deploy time.
          NEXT_PUBLIC_API_URL: https://placeholder.example.com/api/v1
