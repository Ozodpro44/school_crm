basePath: /api/v1
definitions:
  models.CreateSubscriptionRequest:
    properties:
      branch_id:
        type: string
      notes:
        type: string
      payment_method:
        type: string
      plan_id:
        type: string
    required:
    - plan_id
    type: object
  models.DeveloperLoginRequest:
    properties:
      email:
        type: string
      password:
        minLength: 6
        type: string
    required:
    - email
    - password
    type: object
  models.DeveloperLoginResponse:
    properties:
      email:
        type: string
      fullName:
        type: string
      id:
        type: string
      role:
        type: string
      token:
        type: string
    type: object
  models.DeveloperRegisterRequest:
    properties:
      email:
        type: string
      fullName:
        minLength: 2
        type: string
      password:
        minLength: 6
        type: string
    required:
    - email
    - fullName
    - password
    type: object
  models.JSONMap:
    additionalProperties: true
    type: object
  models.Subscription:
    properties:
      auto_renew:
        type: boolean
      branch_id:
        type: string
      cancelled_at:
        type: string
      cancelled_by:
        type: string
      created_at:
        type: string
      end_date:
        type: string
      id:
        type: string
      notes:
        type: string
      payment_method:
        type: string
      plan_id:
        type: string
      renewal_date:
        type: string
      start_date:
        type: string
      status:
        description: active, paused, cancelled, expired
        type: string
      stripe_subscription_id:
        type: string
      updated_at:
        type: string
      user_id:
        type: string
    type: object
  models.SubscriptionPayment:
    properties:
      amount:
        type: number
      click_payment_id:
        type: string
      created_at:
        type: string
      currency:
        type: string
      id:
        type: string
      invoice_number:
        type: string
      notes:
        type: string
      payment_date:
        type: string
      payment_method:
        type: string
      status:
        description: pending, completed, failed, refunded
        type: string
      stripe_payment_id:
        type: string
      subscription_id:
        type: string
      updated_at:
        type: string
    type: object
  models.SubscriptionPlan:
    properties:
      billingPeriod:
        description: monthly, yearly (accept camelCase from frontend)
        type: string
      createdAt:
        type: string
      description:
        type: string
      features:
        $ref: '#/definitions/models.JSONMap'
      id:
        type: string
      maxBranches:
        type: integer
      maxClasses:
        type: integer
      maxStudents:
        type: integer
      name:
        type: string
      price:
        type: number
      status:
        description: active, inactive
        type: string
      updatedAt:
        type: string
    type: object
  models.SubscriptionUsage:
    properties:
      current_usage:
        type: integer
      id:
        type: string
      limit_value:
        type: integer
      metric_name:
        description: branches, students, classes
        type: string
      reset_date:
        type: string
      subscription_id:
        type: string
      updated_at:
        type: string
    type: object
  service.LoginRequest:
    properties:
      email:
        type: string
      password:
        type: string
    required:
    - email
    - password
    type: object
  service.RegisterRequest:
    properties:
      email:
        type: string
      fullName:
        type: string
      password:
        minLength: 6
        type: string
      role:
        type: string
      schoolName:
        type: string
    required:
    - email
    - fullName
    - password
    - role
    type: object
externalDocs:
  description: OpenAPI spec
  url: http://localhost:8080/api/docs/doc.json
host: localhost:8080
info:
  contact:
    email: support@school-crm.example
    name: School CRM Support
  description: Residual monolith — auth, subscriptions, Click.uz/Telegram payments,
    messaging, reports, dev panel.
  license:
    name: Proprietary
  termsOfService: http://swagger.io/terms/
  title: School CRM API
  version: "1.0"
paths:
  /attendance:
    get:
      description: Returns attendance records for a class and date.
      parameters:
      - description: Class ID
        in: query
        name: classId
        required: true
        type: string
      - description: YYYY-MM-DD
        in: query
        name: date
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Get attendance
      tags:
      - attendance
    post:
      consumes:
      - application/json
      description: Creates or updates attendance records for a class session.
      parameters:
      - description: class_id, date, records (student_id, status)
        in: body
        name: body
        required: true
        schema:
          additionalProperties: true
          type: object
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties:
              type: string
            type: object
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Record attendance
      tags:
      - attendance
  /auth/forgot-password:
    post:
      consumes:
      - application/json
      description: Sends a 6-digit OTP to the given email address.
      parameters:
      - description: Email
        in: body
        name: body
        required: true
        schema:
          type: object
      produces:
      - application/json
      responses:
        "200":
          description: OTP sent
          schema:
            additionalProperties:
              type: string
            type: object
        "400":
          description: invalid email or user not found
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Forgot password
      tags:
      - auth
  /auth/login:
    post:
      consumes:
      - application/json
      description: Authenticate with email + password. Returns a signed JWT valid
        for 24 h.
      parameters:
      - description: Credentials
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/service.LoginRequest'
      produces:
      - application/json
      responses:
        "200":
          description: token + user object
          schema:
            additionalProperties: true
            type: object
        "400":
          description: invalid request body
          schema:
            additionalProperties:
              type: string
            type: object
        "401":
          description: invalid credentials
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Login
      tags:
      - auth
  /auth/register:
    post:
      consumes:
      - application/json
      description: Public registration is restricted to the "admin" role. Returns
        a JWT on success.
      parameters:
      - description: Registration data
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/service.RegisterRequest'
      produces:
      - application/json
      responses:
        "201":
          description: token + user object
          schema:
            additionalProperties: true
            type: object
        "400":
          description: invalid request body
          schema:
            additionalProperties:
              type: string
            type: object
        "403":
          description: only admin role allowed
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: internal error
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Register
      tags:
      - auth
  /auth/resend-otp:
    post:
      consumes:
      - application/json
      description: Generates a new OTP and resends it to the given email.
      parameters:
      - description: Email
        in: body
        name: body
        required: true
        schema:
          type: object
      produces:
      - application/json
      responses:
        "200":
          description: OTP resent
          schema:
            additionalProperties:
              type: string
            type: object
        "400":
          description: error
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Resend OTP
      tags:
      - auth
  /auth/reset-password:
    post:
      consumes:
      - application/json
      description: Sets a new password using the reset token obtained from VerifyOTP.
      parameters:
      - description: Email + resetToken + newPassword
        in: body
        name: body
        required: true
        schema:
          type: object
      produces:
      - application/json
      responses:
        "200":
          description: password reset successfully
          schema:
            additionalProperties:
              type: string
            type: object
        "400":
          description: invalid token or email
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Reset password
      tags:
      - auth
  /auth/verify-otp:
    post:
      consumes:
      - application/json
      description: Validates the 6-digit OTP and returns a short-lived reset token.
      parameters:
      - description: Email + OTP
        in: body
        name: body
        required: true
        schema:
          type: object
      produces:
      - application/json
      responses:
        "200":
          description: resetToken
          schema:
            additionalProperties:
              type: string
            type: object
        "400":
          description: invalid or expired OTP
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Verify OTP
      tags:
      - auth
  /branches:
    get:
      description: Returns all branches belonging to the authenticated admin.
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              additionalProperties: true
              type: object
            type: array
        "500":
          description: Internal Server Error
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: List branches
      tags:
      - branches
    post:
      consumes:
      - application/json
      description: Creates a new branch under the authenticated school owner.
      parameters:
      - description: name, address, phone
        in: body
        name: body
        required: true
        schema:
          additionalProperties: true
          type: object
      produces:
      - application/json
      responses:
        "201":
          description: created branch
          schema:
            additionalProperties: true
            type: object
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "402":
          description: subscription_limit_reached
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Create branch
      tags:
      - branches
  /branches/{id}:
    delete:
      parameters:
      - description: Branch UUID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: branch deleted
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Delete branch
      tags:
      - branches
    put:
      consumes:
      - application/json
      parameters:
      - description: Branch UUID
        in: path
        name: id
        required: true
        type: string
      - description: Fields to update
        in: body
        name: body
        required: true
        schema:
          additionalProperties: true
          type: object
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Update branch
      tags:
      - branches
  /classes:
    get:
      description: Returns all classes for a branch.
      parameters:
      - description: Branch ID
        in: query
        name: branchId
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              additionalProperties: true
              type: object
            type: array
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: List classes
      tags:
      - classes
    post:
      consumes:
      - application/json
      parameters:
      - description: name, branch_id, teacher_id, schedule
        in: body
        name: body
        required: true
        schema:
          additionalProperties: true
          type: object
      produces:
      - application/json
      responses:
        "201":
          description: created class
          schema:
            additionalProperties: true
            type: object
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Create class
      tags:
      - classes
  /classes/{id}:
    delete:
      parameters:
      - description: Class UUID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: class deleted
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Delete class
      tags:
      - classes
  /dev/auth/login:
    post:
      consumes:
      - application/json
      description: Authenticate a developer and return JWT token
      parameters:
      - description: Developer login credentials
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/models.DeveloperLoginRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/models.DeveloperLoginResponse'
        "400":
          description: Bad Request
          schema:
            additionalProperties: true
            type: object
        "401":
          description: Unauthorized
          schema:
            additionalProperties: true
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties: true
            type: object
      summary: Developer Login
      tags:
      - developer-auth
  /dev/auth/register:
    post:
      consumes:
      - application/json
      description: Register a new developer account
      parameters:
      - description: Developer registration details
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/models.DeveloperRegisterRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/models.DeveloperLoginResponse'
        "400":
          description: Bad Request
          schema:
            additionalProperties: true
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties: true
            type: object
      summary: Developer Registration
      tags:
      - developer-auth
  /dev/subscription-plans:
    post:
      consumes:
      - application/json
      description: Create a new subscription plan (dev/admin only)
      parameters:
      - description: Create subscription plan request
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/models.SubscriptionPlan'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/models.SubscriptionPlan'
        "400":
          description: Bad Request
          schema:
            additionalProperties: true
            type: object
        "403":
          description: Forbidden
          schema:
            additionalProperties: true
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties: true
            type: object
      summary: Create subscription plan
      tags:
      - subscriptions
  /dev/subscription-plans/{id}:
    delete:
      description: Delete a subscription plan (dev/admin only)
      parameters:
      - description: Plan ID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
        "400":
          description: Bad Request
          schema:
            additionalProperties: true
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties: true
            type: object
      summary: Delete subscription plan
      tags:
      - subscriptions
    put:
      consumes:
      - application/json
      description: Update an existing subscription plan (dev/admin only)
      parameters:
      - description: Plan ID
        in: path
        name: id
        required: true
        type: string
      - description: Update subscription plan request
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/models.SubscriptionPlan'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/models.SubscriptionPlan'
        "400":
          description: Bad Request
          schema:
            additionalProperties: true
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties: true
            type: object
      summary: Update subscription plan
      tags:
      - subscriptions
  /dev/test-payment:
    post:
      description: Manually complete a payment for testing
      parameters:
      - description: Invoice number
        in: query
        name: invoice_id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
        "400":
          description: Bad Request
          schema:
            additionalProperties: true
            type: object
      summary: Test payment completion
      tags:
      - payments
  /expenses:
    get:
      description: Returns expense records for a branch, optionally filtered by date
        range.
      parameters:
      - description: Branch ID
        in: query
        name: branchId
        required: true
        type: string
      - description: YYYY-MM-DD
        in: query
        name: startDate
        type: string
      - description: YYYY-MM-DD
        in: query
        name: endDate
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: List expenses
      tags:
      - expenses
    post:
      consumes:
      - application/json
      parameters:
      - description: title, amount, category, branch_id, date, payment_method
        in: body
        name: body
        required: true
        schema:
          additionalProperties: true
          type: object
      produces:
      - application/json
      responses:
        "201":
          description: created expense
          schema:
            additionalProperties: true
            type: object
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Create expense
      tags:
      - expenses
  /expenses/{id}:
    delete:
      parameters:
      - description: Expense UUID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: expense deleted
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Delete expense
      tags:
      - expenses
  /health:
    get:
      description: Returns server uptime, DB connection stats, and Redis status.
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
      summary: Health check
      tags:
      - system
  /jobs:
    post:
      consumes:
      - application/json
      description: Enqueues a background job (e.g. report generation, bulk operations).
        Returns a job ID for polling.
      parameters:
      - description: type, payload
        in: body
        name: body
        required: true
        schema:
          additionalProperties: true
          type: object
      produces:
      - application/json
      responses:
        "202":
          description: job_id, status
          schema:
            additionalProperties: true
            type: object
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Submit async job
      tags:
      - jobs
  /jobs/{id}:
    get:
      description: Polls the status and result of a background job by ID.
      parameters:
      - description: Job ID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: id, status, result, created_at
          schema:
            additionalProperties: true
            type: object
        "404":
          description: job not found
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Get job status
      tags:
      - jobs
  /messages:
    get:
      description: Returns Telegram message log for the branch.
      parameters:
      - description: Branch ID
        in: query
        name: branchId
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              additionalProperties: true
              type: object
            type: array
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: List message history
      tags:
      - messaging
  /messages/send:
    post:
      consumes:
      - application/json
      description: Sends a Telegram message to a filtered group of students (bulk
        or individual).
      parameters:
      - description: branch_id, text, filter (classId, status, paymentStatus)
        in: body
        name: body
        required: true
        schema:
          additionalProperties: true
          type: object
      produces:
      - application/json
      responses:
        "200":
          description: sent, failed counts
          schema:
            additionalProperties: true
            type: object
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Send Telegram message
      tags:
      - messaging
  /messages/student/{id}/telegram:
    put:
      consumes:
      - application/json
      description: Associates a Telegram chat ID with a student record so they receive
        Telegram notifications.
      parameters:
      - description: Student UUID
        in: path
        name: id
        required: true
        type: string
      - description: telegram_id
        in: body
        name: body
        required: true
        schema:
          additionalProperties: true
          type: object
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties:
              type: string
            type: object
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Set student Telegram ID
      tags:
      - messaging
  /notifications:
    get:
      description: Returns unread notifications for the current user's branch.
      parameters:
      - description: Branch ID
        in: query
        name: branchId
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              additionalProperties: true
              type: object
            type: array
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: List notifications
      tags:
      - notifications
  /notifications/read:
    post:
      parameters:
      - description: Branch ID
        in: query
        name: branchId
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Mark notifications as read
      tags:
      - notifications
  /payment-types:
    get:
      description: Returns all active payment types (public — no auth required).
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              additionalProperties: true
              type: object
            type: array
      summary: List payment types
