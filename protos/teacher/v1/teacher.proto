syntax = "proto3";

package teacher.v1;

import "common/v1/common.proto";
import "google/protobuf/timestamp.proto";

option go_package = "github.com/school-crm/protos/teacher/v1;teacherv1";

message Teacher {
  string teacher_id      = 1;
  string user_id         = 2;
  string full_name       = 3;
  string phone           = 4;
  string email           = 5;
  string branch_id       = 6;
  double monthly_salary  = 7;
  string status          = 8;
  google.protobuf.Timestamp created_at = 9;
}

message GetTeacherRequest {
  string teacher_id = 1;
}
message GetTeacherResponse {
  Teacher teacher = 1;
}

message ListTeachersRequest {
  string branch_id = 1;
  string search    = 2;
  common.v1.PageRequest page = 3;
}
message ListTeachersResponse {
  repeated Teacher       teachers = 1;
  common.v1.PageResponse page     = 2;
}

service TeacherService {
  rpc GetTeacher(GetTeacherRequest) returns (GetTeacherResponse);
  rpc ListTeachers(ListTeachersRequest) returns (ListTeachersResponse);
}
