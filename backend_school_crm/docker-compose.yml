version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: school_crm_db
    environment:
      POSTGRES_USER: school_user
      POSTGRES_PASSWORD: school_password
      POSTGRES_DB: school_crm
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U school_user"]
      interval: 10s
      timeout: 5s
      retries: 5

  pgbouncer:
    image: bitnami/pgbouncer:latest
    container_name: school_crm_pgbouncer
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      POSTGRESQL_HOST: postgres
      POSTGRESQL_PORT: 5432
      POSTGRESQL_DATABASE: school_crm
      POSTGRESQL_USERNAME: school_user
      POSTGRESQL_PASSWORD: school_password
      PGBOUNCER_PORT: 6432
      PGBOUNCER_POOL_MODE: transaction
      PGBOUNCER_MAX_CLIENT_CONN: "200"
      PGBOUNCER_DEFAULT_POOL_SIZE: "20"
      PGBOUNCER_MIN_POOL_SIZE: "2"
      PGBOUNCER_RESERVE_POOL_SIZE: "5"
      PGBOUNCER_AUTH_TYPE: md5
    ports:
      - "6432:6432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h localhost -p 6432 -U school_user"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: school_crm_redis
    command: redis-server --save 60 1 --loglevel warning
    volumes:
      - redis_data:/data
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── Monolith (shifted to internal port 8082; not exposed directly) ───────────
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: school_crm_backend
    depends_on:
      pgbouncer:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://school_user:school_password@pgbouncer:6432/school_crm?sslmode=disable&disable_prepared_statements=1
      REDIS_URL: redis://redis:6379
      JWT_SECRET: change_me_in_production_min_32_chars!!
      PORT: "8082"
      ENVIRONMENT: development
    expose:
      - "8082"
    restart: unless-stopped

  # ── auth_service (P2.1 / P2.2) ───────────────────────────────────────────────
  auth_service:
    build:
      context: ../auth_service
      dockerfile: Dockerfile
    container_name: school_crm_auth
    depends_on:
      pgbouncer:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://school_user:school_password@pgbouncer:6432/school_crm?sslmode=disable&disable_prepared_statements=1
      REDIS_URL: redis://redis:6379
      JWT_SECRET: change_me_in_production_min_32_chars!!
      PORT: "8081"
      GRPC_PORT: "50051"
      ENVIRONMENT: development
    expose:
      - "8081"
      - "50051"
    restart: unless-stopped

  # ── user_service (P4.1) ──────────────────────────────────────────────────────
  user_service:
    build:
      context: ../user_service
      dockerfile: Dockerfile
    container_name: school_crm_user
    depends_on:
      pgbouncer:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://school_user:school_password@pgbouncer:6432/school_crm?sslmode=disable&disable_prepared_statements=1
      REDIS_URL: redis://redis:6379
      JWT_SECRET: change_me_in_production_min_32_chars!!
      PORT: "8084"
      GRPC_PORT: "50054"
      ENVIRONMENT: development
    expose:
      - "8084"
      - "50054"
    restart: unless-stopped

  # ── student_service (P4.2) ───────────────────────────────────────────────────
  student_service:
    build:
      context: ../student_service
      dockerfile: Dockerfile
    container_name: school_crm_student
    depends_on:
      pgbouncer:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://school_user:school_password@pgbouncer:6432/school_crm?sslmode=disable&disable_prepared_statements=1
      REDIS_URL: redis://redis:6379
      PORT: "8085"
      GRPC_PORT: "50055"
      ENVIRONMENT: development
    expose:
      - "8085"
      - "50055"
    restart: unless-stopped

  # ── payment_service (P3.2 / P3.5) ───────────────────────────────────────────
  payment_service:
    build:
      context: ../payment_service
      dockerfile: Dockerfile
    container_name: school_crm_payment
    depends_on:
      pgbouncer:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://school_user:school_password@pgbouncer:6432/school_crm?sslmode=disable&disable_prepared_statements=1
      REDIS_URL: redis://redis:6379
      JWT_SECRET: change_me_in_production_min_32_chars!!
      PORT: "8083"
      GRPC_PORT: "50053"
      ENVIRONMENT: development
    expose:
      - "8083"
      - "50053"
    restart: unless-stopped

  # ── teacher_service (P5.1) ───────────────────────────────────────────────────
  teacher_service:
    build:
      context: ../teacher_service
      dockerfile: Dockerfile
    container_name: school_crm_teacher
    depends_on:
      pgbouncer:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://school_user:school_password@pgbouncer:6432/school_crm?sslmode=disable&disable_prepared_statements=1
      REDIS_URL: redis://redis:6379
      PORT: "8086"
      GRPC_PORT: "50056"
      ENVIRONMENT: development
    expose:
      - "8086"
      - "50056"
    restart: unless-stopped

  # ── finance_service (P5.2) ───────────────────────────────────────────────────
  finance_service:
    build:
      context: ../finance_service
      dockerfile: Dockerfile
    container_name: school_crm_finance
    depends_on:
      pgbouncer:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://school_user:school_password@pgbouncer:6432/school_crm?sslmode=disable&disable_prepared_statements=1
      # DATABASE_READ_URL: postgres://school_user:school_password@postgres_replica:5432/school_crm
      PORT: "8087"
      GRPC_PORT: "50057"
      ENVIRONMENT: development
    expose:
      - "8087"
      - "50057"
    restart: unless-stopped

  # ── notification_service (P5.3) ──────────────────────────────────────────────
  notification_service:
    build:
      context: ../notification_service
      dockerfile: Dockerfile
    container_name: school_crm_notification
    depends_on:
      pgbouncer:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://school_user:school_password@pgbouncer:6432/school_crm?sslmode=disable&disable_prepared_statements=1
      REDIS_URL: redis://redis:6379
      PORT: "8088"
      ENVIRONMENT: development
    expose:
      - "8088"
    restart: unless-stopped

  # ── api_gateway (P2.3–P5.5) — single public entry point ─────────────────────
  api_gateway:
    build:
      context: ../api_gateway
      dockerfile: Dockerfile
    container_name: school_crm_gateway
    depends_on:
      - backend
      - auth_service
      - payment_service
      - user_service
      - student_service
      - teacher_service
      - finance_service
      - notification_service
    environment:
      JWT_SECRET: change_me_in_production_min_32_chars!!
      REDIS_URL: redis://redis:6379
      PORT: "8080"
      ENVIRONMENT: development
      MONOLITH_URL: http://backend:8082
      AUTH_SERVICE_URL: http://auth_service:8081
      PAYMENT_SERVICE_URL: http://payment_service:8083
      USER_SERVICE_URL: http://user_service:8084
      STUDENT_SERVICE_URL: http://student_service:8085
      TEACHER_SERVICE_URL: http://teacher_service:8086
      FINANCE_SERVICE_URL: http://finance_service:8087
      NOTIFICATION_SERVICE_URL: http://notification_service:8088
    ports:
      - "8080:8080"
    restart: unless-stopped

volumes:
  postgres_data:
  redis_data:
