name: CI

on:
  push:
    branches: [main, test]
  pull_request:
    branches: [main, test]

# Cancel in-progress runs on the same branch when a new push arrives.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ──────────────────────────────────────────────────────────────────────────────
  #  Monolith — full test suite (unit + middleware + handler tests)
  # ──────────────────────────────────────────────────────────────────────────────
  monolith:
    name: Monolith (Go)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend_school_crm

    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: backend_school_crm/go.mod
          cache-dependency-path: backend_school_crm/go.sum

      - name: Download modules
        run: go mod download

      - name: Verify go.sum
        run: go mod verify

      - name: go vet
        run: go vet ./...

      - name: Build
        run: go build ./cmd/...

      - name: Test (unit, no DB required)
        run: go test -race -short -coverprofile=coverage.out ./...

      - name: Coverage summary
        run: go tool cover -func=coverage.out | tail -1

  # ──────────────────────────────────────────────────────────────────────────────
  #  Microservices — vet + build (matrix, one job per service)
  # ──────────────────────────────────────────────────────────────────────────────
  microservices:
    name: ${{ matrix.service }} (Go)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service:
          - api_gateway
          - auth_service
          - finance_service
          - notification_service
          - payment_service
          - student_service
          - teacher_service
          - user_service

    defaults:
      run:
        working-directory: ${{ matrix.service }}

    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: ${{ matrix.service }}/go.mod
          cache-dependency-path: ${{ matrix.service }}/go.sum

      - name: Download modules
        run: go mod download

      - name: Verify go.sum
        run: go mod verify

      - name: go vet
        run: go vet ./...

      - name: Build
        run: go build ./...

  # ──────────────────────────────────────────────────────────────────────────────
  #  Docker builds — verify all Dockerfiles build without error
  # ──────────────────────────────────────────────────────────────────────────────
  docker:
    name: Docker build — ${{ matrix.service }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - service: backend_school_crm
            context: backend_school_crm
          - service: api_gateway
            context: api_gateway
          - service: auth_service
            context: auth_service
          - service: finance_service
            context: finance_service
          - service: notification_service
            context: notification_service
          - service: payment_service
            context: payment_service
          - service: student_service
            context: student_service
          - service: teacher_service
            context: teacher_service
          - service: user_service
            context: user_service

    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build image (no push)
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          push: false
          # Cache layers between runs using GitHub Actions cache.
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}

  # ──────────────────────────────────────────────────────────────────────────────
  #  Frontend — lint + type-check + build
  # ──────────────────────────────────────────────────────────────────────────────
  frontend:
    name: Frontend (Next.js)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend_school_crm

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend_school_crm/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Type check
        run: npx tsc --noEmit

      - name: Build
        run: npm run build
        env:
          # Placeholder so config validation doesn't abort the build.
          # The real URL is injected at deploy time in Railway.
          NEXT_PUBLIC_API_URL: https://placeholder.example.com/api/v1

  # ──────────────────────────────────────────────────────────────────────────────
  #  Gate — all jobs must pass before merging
  # ──────────────────────────────────────────────────────────────────────────────
  all-pass:
    name: All checks passed
    runs-on: ubuntu-latest
    needs: [monolith, microservices, docker, frontend]
    if: always()
    steps:
      - name: Check results
        run: |
          if [[ "${{ contains(needs.*.result, 'failure') }}" == "true" ]]; then
            echo "One or more CI jobs failed."
            exit 1
          fi
          echo "All CI checks passed."
