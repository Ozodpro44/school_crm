# Railway configuration — REST API service.
#
# Two Railway services share this repo:
#   Service 1 (rest-api)  → Dockerfile        → PORT injected by Railway
#   Service 2 (grpc-api)  → Dockerfile.grpc   → PORT injected by Railway
#
# To add the gRPC service in Railway dashboard:
#   1. New Service → GitHub repo → same repo
#   2. Settings → Build → Dockerfile Path → "Dockerfile.grpc"
#   3. Add env vars: DATABASE_URL, JWT_SECRET, REDIS_URL (same values as REST)
#   4. Deploy

[build]
builder = "dockerfile"
dockerfilePath = "Dockerfile"

[deploy]
healthcheckPath = "/health"
healthcheckTimeout = 30
restartPolicyType = "on_failure"
restartPolicyMaxRetries = 3
