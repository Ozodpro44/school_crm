[databases]
; Route all connections to the primary PostgreSQL instance.
; In production replace "postgres" with the actual host/IP or Railway internal hostname.
schoolcrm = host=postgres port=5432 dbname=school_crm

[pgbouncer]
listen_addr = 0.0.0.0
listen_port = 6432

; Transaction mode: the connection is returned to the pool after every
; transaction. This is the most efficient mode and required when using
; prepared statements via pgx (disable prepared statements in the DSN).
pool_mode = transaction

; Max server-side connections to PostgreSQL (kept small — PgBouncer multiplexes)
max_client_conn = 200
default_pool_size = 20
min_pool_size = 2
reserve_pool_size = 5
reserve_pool_timeout = 5

; Authentication — use md5 (or scram-sha-256 if PgBouncer >= 1.18)
auth_type = md5
auth_file = /etc/pgbouncer/userlist.txt

; Connection health
server_idle_timeout = 600
server_lifetime = 3600
client_idle_timeout = 0

; Logging (reduce noise in production)
log_connections = 0
log_disconnections = 0
log_pooler_errors = 1

; Admin interface (restrict in production)
admin_users = pgbouncer_admin
stats_users = pgbouncer_admin
